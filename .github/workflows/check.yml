# Гейт повторяет таблицу Verification из CLAUDE.md и НИЧЕГО сверх неё. Красный крестик на
# публичном репозитории из-за проверки, которой нет локально, хуже отсутствия CI вовсе.
#
# Rust (`cargo check`) и релизная сборка сюда сознательно не входят: `src-tauri` меняется
# редко, а apt-зависимости Tauri и холодная сборка дерева крейтов дали бы главный источник
# времени и флака. Решение 2026-09-04, см. docs/ROADMAP.md.
name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Версия пинится: гейт обязан падать от кода, а не оттого, что раннер подтянул
      # свежий bun с другим поведением встроенного раннера тестов.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Именно `-b`, НЕ `--noEmit`: корневой tsconfig — solution-stub с `files: []`, при
      # `--noEmit` проверяется 0 файлов и гейт зелёный всегда.
      - run: bun tsc -b

      - run: bun lint

      - run: bun test
