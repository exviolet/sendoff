[package]
name = "sendoff-desktop"
version = "0.3.0"
description = "Sendoff — desktop wrapper via Tauri v2"
authors = ["exviolet"]
license = "MIT"
repository = "https://github.com/exviolet/sendoff"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-mcp-bridge = { version = "0.11", optional = true }

# Только ради версии WebKitGTK для Sendoff Doctor: safe-обёртка `webkit2gtk` версий не
# экспортирует, а `navigator.userAgent` отдаёт фиксированное Safari-compat число
# (AppleWebKit/605.1.15) — по нему 2.44 от 2.46 не отличить. Крейт уже присутствует в
# Cargo.lock транзитивно (wry → webkit2gtk → -sys), поэтому объявление ничего не досбирает.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "2.0"

[features]
# dev-only MCP-мост (tauri-plugin-mcp-bridge): включается через `--features mcp-bridge`
# в dev-скрипте, в release-сборке отсутствует физически.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]
